<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TB XAI Detection System</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 40px 0;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            margin: 0;
            font-size: 40px;
            color: #0f172a;
        }

        .title p {
            color: #64748b;
            margin-top: 10px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="file"],
        input[type="text"] {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #dbe2ea;
            width: 100%;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .prediction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: #eff6ff;
            padding: 20px;
            border-radius: 14px;
        }

        .stat-box h3 {
            margin: 0;
            color: #1e3a8a;
            font-size: 14px;
        }

        .stat-box p {
            margin-top: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .heatmap-container {
            margin-top: 30px;
            text-align: center;
        }

        .heatmap-container img {
            width: 100%;
            max-width: 600px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .rag-box {
            margin-top: 30px;
            line-height: 1.8;
            font-size: 16px;
            color: #334155;
            white-space: pre-line;
        }

        .loading {
            display: none;
            margin-top: 20px;
            color: #2563eb;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>Explainable Tuberculosis Detection</h1>
        <p>
            Multimodal AI system using ResNet50, BERT, Explainable AI, and Retrieval-Augmented Generation.
        </p>
    </div>

    <div class="card">

        <div class="upload-area">

            <input type="file" id="file">

            <input
                type="text"
                id="question"
                value="Is tuberculosis present in the chest X-ray?"
            >

            <button onclick="sendPrediction()">
                Analyze X-ray
            </button>

            <div class="loading" id="loading">
                Processing image... this may take a few seconds.
            </div>

        </div>

    </div>

    <div class="results" id="results">

        <div class="prediction-grid">

            <div class="stat-box">
                <h3>Prediction</h3>
                <p id="answer"></p>
            </div>

            <div class="stat-box">
                <h3>Confidence</h3>
                <p id="confidence"></p>
            </div>

            <div class="stat-box">
                <h3>Explainability Method</h3>
                <p id="camMethod"></p>
            </div>

        </div>

        <div class="card heatmap-container">

            <h2>Explainability Heatmap</h2>

            <img id="heatmap">

        </div>

        <div class="card">

            <h2>Clinical Explanation</h2>

            <div class="rag-box" id="ragContext"></div>

        </div>

    </div>

</div>

<script>

async function sendPrediction() {

    const file = document.getElementById("file").files[0];
    const question = document.getElementById("question").value;

    if (!file) {
        alert("Please upload an X-ray image.");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("results").style.display = "none";

    let form = new FormData();

    form.append("file", file);
    form.append("question", question);

    const response = await fetch("/predict", {
        method: "POST",
        body: form
    });

    const data = await response.json();

    // =========================
    // UPDATE UI
    // =========================

    document.getElementById("answer").innerText =
        data.answer;

    document.getElementById("confidence").innerText =
        (data.confidence * 100).toFixed(2) + "%";

    document.getElementById("camMethod").innerText =
        data.cam_method;

    document.getElementById("ragContext").innerText =
        data.rag_context;

    document.getElementById("heatmap").src =
        "data:image/png;base64," + data.heatmap;

    document.getElementById("loading").style.display = "none";
    document.getElementById("results").style.display = "block";
}

</script>

</body>
</html>
